  // ---------- 畫面 ----------
  function render(d) {
    var el = ensureMount();
    var prev = {};
    if (LAST) LAST.clinics.forEach(function (c) { prev[c.name] = c.qty; });
    LAST = d; CUR_V = d.v == null ? CUR_V : d.v;
    var vacs = (d.vaccines || []).map(splitVac);

    var list = (d.clinics || []).map(function (c) {
      var info = INFO[c.name] || {};
      var dist = (GEO && info.lat) ? km(GEO, info) : null;
      return { c: c, info: info, dist: dist };
    });
    if (GEO) list.sort(function (a, b) { return (a.dist == null ? 9e9 : a.dist) - (b.dist == null ? 9e9 : b.dist); });
    if (COUNTY) list = list.filter(function (x) { return county(x.c.name) === COUNTY; });

    var cards = list.map(function (x, idx) {
      var c = x.c, info = x.info;
      var rows = vacs.map(function (v, i) {
        var q = c.qty[i], st = state(q);
        var changed = prev[c.name] && String(prev[c.name][i]) !== String(q);
        var qtyHtml = q == null ? '—' : (st === 'txt' ? esc(q) : esc(q) + '<small>劑</small>');
        var pill = st === 'txt' ? '' : '<span class="jv-pill ' + st + '">' + LABEL[st] + '</span>';
        return '<div class="jv-row"><div class="jv-vac"><span class="jv-tag' + (v.pub ? ' pub' : '') + '">' + v.tag + '</span>' + esc(v.name) + '</div>' +
          '<div style="display:flex;align-items:center;gap:6px"><span class="jv-qty ' + st + (changed ? ' jv-flash' : '') + '">' + qtyHtml + '</span>' + pill + '</div></div>';
      }).join('');
      var tel = info.tel ? '<a class="jv-tel" href="tel:' + esc(info.tel.replace(/[^\d+]/g, '')) + '" aria-label="撥打' + esc(c.name) + '">' + PHONE_ICON + '<span>' + esc(info.tel) + '</span></a>' : '';
      var near = GEO && idx === 0 && !COUNTY && x.dist != null;
      var distHtml = x.dist != null ? '<span class="jv-dist">' + PIN_ICON.replace('<svg', '<svg style="width:11px;height:11px;fill:currentColor;vertical-align:-1px"') + ' ' + (x.dist < 10 ? x.dist.toFixed(1) : Math.round(x.dist)) + ' km</span>' : '';
      var nav = info.a ? '<a href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(info.a) + (GEO ? '&origin=' + GEO.lat + ',' + GEO.lng : '') + '" target="_blank" rel="noopener">' + NAV_ICON + '導航</a>' : '';
      return '<div class="jv-card' + (near ? ' near' : '') + (idx >= MOBILE_LIMIT && !SHOW_ALL ? ' hide-m' : '') + '">' +
        '<div class="jv-cname"><span class="jv-n">' + esc(c.name) + (near ? '<span class="jv-near">最近</span>' : '') + '</span>' + tel + '</div>' + rows +
        '<div class="jv-meta"><span>' + (c.updatedAt ? '更新 ' + esc(c.updatedAt) : '尚未回報') + '</span><span style="display:flex;gap:10px;align-items:center">' + distHtml + nav + '</span></div></div>';
    }).join('');

    var hidden = Math.max(0, list.length - MOBILE_LIMIT);
    var logo = LOGO ? '<img class="jv-logo" src="' + esc(LOGO) + '" alt="金鶯診所">' : '';

    el.innerHTML = '<style>' + CSS + '</style>' + WAVE + WAVE_B +
      '<div class="jv-in">' +
      '<div class="jv-head">' + logo + '<div>' +
        '<span class="jv-kick">各院區即時庫存</span>' +
        '<h2 class="jv-title"><span class="jv-t1">自費</span><span>／</span><span class="jv-t2">公費</span><span>流感疫苗</span></h2>' +
        '<div class="jv-sub">免預約，隨到隨打</div>' +
      '</div></div>' +
      '<div class="jv-tools">' +
        '<button type="button" class="jv-btn' + (GEO ? ' on' : '') + '" id="jv-geo-btn">' + PIN_ICON + (GEO ? '已依我的位置排序' : '依我的位置排序') + '</button>' +
        ['', '新北', '桃園'].map(function (k) { return '<button type="button" class="jv-chip' + (COUNTY === k ? ' on' : '') + '" data-county="' + k + '">' + (k || '全部院區') + '</button>'; }).join('') +
        '<div class="jv-geo" id="jv-geo-msg"></div>' +
      '</div>' +
      '<div class="jv-legend"><span><i style="background:var(--jv-ok)"></i>充足 ' + LOW + ' 劑以上</span><span><i style="background:var(--jv-low)"></i>少量 1–' + (LOW - 1) + ' 劑</span><span><i style="background:var(--jv-out)"></i>缺貨</span><span><i style="background:#B9CFCF"></i>未回報</span><span><i style="background:#7a7a7a"></i>不提供</span></div>' +
      '<div class="jv-grid">' + cards + '</div>' +
      (hidden > 0 && !SHOW_ALL ? '<div style="text-align:center"><button type="button" class="jv-btn jv-more" id="jv-more">顯示其餘 ' + hidden + ' 個院區</button></div>' : '') +
      '<div class="jv-foot"><span class="jv-live"></span>數量由各院區人員回報，最後更新 <b>' + esc(d.latestUpdate || '—') + '</b>・庫存變動快速，前往前請先致電院區確認是否有存量</div></div>';

    var gb = el.querySelector('#jv-geo-btn'); if (gb) gb.onclick = function () { locate(false); };
    var mb = el.querySelector('#jv-more'); if (mb) mb.onclick = function () { SHOW_ALL = true; render(LAST); };
    Array.prototype.forEach.call(el.querySelectorAll('.jv-chip'), function (b) { b.onclick = function () { COUNTY = b.getAttribute('data-county'); SHOW_ALL = false; render(LAST); }; });
  }

  // ---------- 定位 ----------
  function geoMsg(t) { var m = document.getElementById('jv-geo-msg'); if (m) m.textContent = t || ''; }
  function locate(auto) {
    if (!navigator.geolocation) { geoMsg('此裝置不支援定位'); return; }
    if (!auto) geoMsg('正在取得您的位置…');
    navigator.geolocation.getCurrentPosition(function (p) {
      GEO = { lat: p.coords.latitude, lng: p.coords.longitude };
      ls('geo_ok', 1); ls('geo_last', { lat: GEO.lat, lng: GEO.lng, t: Date.now() });
      if (LAST) render(LAST);
      geoMsg('已依您的位置由近到遠排序');
    }, function () {
      if (auto) { GEO = null; if (LAST) render(LAST); geoMsg(''); return; }
      geoMsg('無法取得位置，請確認已允許定位');
    }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 });
  }
  function geoInit() {
    var last = ls('geo_last');
    if (ls('geo_ok') && last && last.lat) { GEO = { lat: last.lat, lng: last.lng }; locate(true); }
  }

  // ---------- 資料 ----------
  function jsonp(action, cb) {
    var name = 'jyVax' + Date.now() + Math.floor(Math.random() * 1e4);
    var s = document.createElement('script');
    window[name] = function (d) { try { cb(d); } finally { delete window[name]; s.parentNode && s.parentNode.removeChild(s); } };
    s.src = API + '?action=' + action + '&callback=' + name + '&_=' + Date.now();
    s.onerror = function () { delete window[name]; s.parentNode && s.parentNode.removeChild(s); };
    document.head.appendChild(s);
  }
  var busy = false;
  function load() { if (busy) return; busy = true; jsonp('stock', function (d) { busy = false; if (d && !d.error) render(d); }); }
  function check() { if (document.hidden) return; jsonp('version', function (d) { if (d && d.v != null && d.v !== CUR_V) load(); }); }

  function boot() {
    geoInit();
    if (CFG.data) { render(CFG.data); return; }          // 預覽／靜態資料
    load();
    setInterval(check, POLL);
    setInterval(load, REFRESH);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
